# HappyPhone WebUI — minimal static nginx server block.
# HTTPS is intentionally not configured here: terminate TLS with Cloudflare,
# Caddy, or certbot. Microphone access requires HTTPS in production.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/happyphone;
    index index.html;

    # Hash routing works without rewrites, but this also covers direct paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self)" always;

    # Config and source files should not be cached aggressively during rollout.
    location = /js/config.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Do not serve dotfiles or environment files.
    location ~ /\. {
        deny all;
    }
}
